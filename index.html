
<!DOCTYPE html>
<html>
<head>
    <title>My Website 🩵</title>

    <style>
        body {
            background: linear-gradient(135deg, #dff6ff, #ffffff, #bdeaff);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 45px 25px;
            border-radius: 25px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 8px 30px rgba(100, 180, 220, 0.2);
        }

        h1 {
            color: #5bafd6;
            font-size: 38px;
        }

        p {
            color: #648da5;
            font-size: 18px;
        }

        button {
            background: #91d8f5;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #65bee8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome! 🩵</h1>

        <p>A little space on the internet made just for me.</p>

        <p>Stay dreamy, stay magical. ☁️</p>

        <button onclick="alert('Sending you icy blue vibes! 🩵')">
            Click Me!
        </button>

    </div>

</body>
</html>
